[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genai2openai"
version = "0.2.0"
description = "OpenAI-compatible reverse proxy for ShanghaiTech GenAI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.2",
    "flask-cors>=4.0.0",
    "pycryptodome>=3.20.0",
    "requests>=2.32.5",
    "rich>=14.1.0",
    "tiktoken>=0.12.0",
    "truststore>=0.10.4",
]

[project.scripts]
genai2openai = "genai2openai.cli:main"
genai2openai-login = "genai2openai.cas_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/genai2openai"]
